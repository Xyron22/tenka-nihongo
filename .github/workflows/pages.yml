name: TENKA Core 2 CI and Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: tenka-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Core 2 source syntax
        run: |
          node --check data.js
          node --check content-pack-v1.js
          node --check audio-engine-v2.js
          node --check app-v2.js
          node --check sound-pack-v2.js
          node --check tests/data-v2.js
          node --check tests/system-v2.js
          node --check tests/audio-v2.js
          node --check scripts/build-sound-manifest-v2.mjs
          bash -n scripts/generate-voicevox-nemo.sh

      - name: Data integrity test
        run: node tests/data-v2.js

      - name: TENKA Core 2 system regression test
        run: node tests/system-v2.js

      - name: Audio Engine 2 single-channel test
        run: node tests/audio-v2.js

      - name: Reject legacy runtime and unsafe migration
        run: |
          if grep -E "app\.js|v1-hooks\.js|audio-patch\.js|audio-guard-v1\.2\.[12]\.js|sound-pack-v1\.js" index.html; then
            echo "Legacy runtime reference found in index.html" >&2
            exit 1
          fi
          test ! -e sw.js
          test ! -e scripts/build-sound-pack.mjs
          test ! -e scripts/augment-calm-voice.mjs
          grep -q "audio-engine-v2.js" index.html
          grep -q "app-v2.js" index.html
          grep -q "sound-pack-v2.js" index.html
          grep -q "navigator.serviceWorker.controller" index.html
          grep -q "location.replace" index.html
          grep -q "tenka-audio-v2" index.html

      - name: Restore generated VOICEVOX Nemo cache
        id: voice-cache
        uses: actions/cache@v5
        with:
          path: assets/audio/voicevox
          key: ${{ runner.os }}-tenka-core2-voicevox-${{ hashFiles('scripts/generate-voicevox-nemo.sh') }}

      - name: Generate deterministic VOICEVOX Nemo reactions
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: bash scripts/generate-voicevox-nemo.sh

      - name: Build deterministic sound manifest
        run: node scripts/build-sound-manifest-v2.mjs

      - name: Validate built-in reaction pack
        run: |
          node - <<'NODE'
          const m=require('./assets/audio/manifest.json');
          const events=['greeting','correct','wrong','combo','timeout','finish','perfect'];
          if(m.version!=='2.0.0') throw new Error('Wrong Core 2 sound manifest version: '+m.version);
          if(m.entries.length!==21) throw new Error('Expected exactly 21 built-in voice clips, got '+m.entries.length);
          const styles=new Set(m.entries.map(e=>e.voice));
          if(styles.size!==3) throw new Error('Expected 3 VOICEVOX voice styles, got '+[...styles].join(', '));
          for(const event of events){
            const clips=m.entries.filter(e=>e.event===event);
            if(clips.length!==3) throw new Error(event+' must have exactly 3 voices; found '+clips.length);
          }
          const duplicatePaths=m.entries.filter((e,i,a)=>a.findIndex(x=>x.path===e.path)!==i);
          if(duplicatePaths.length) throw new Error('Duplicate sound asset paths found');
          console.log('Core 2 sound pack validated:',m.entries.length,'clips; voices:',[...styles].join(' / '));
          NODE

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
