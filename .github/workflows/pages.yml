name: Deploy TENKA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
          node --check content-pack-v1.js
          node --check v1-hooks.js
          node --check audio-patch.js
          node --check sound-pack-v1.js
          node --check scripts/build-sound-pack.mjs

      - name: TENKA V1 Safari and system smoke test
        run: node tests/smoke.js

      - name: Restore VOICEVOX Nemo sound cache
        id: voice-cache
        uses: actions/cache@v5
        with:
          path: assets/audio/voicevox
          key: ${{ runner.os }}-tenka-voicevox-nemo-${{ hashFiles('scripts/generate-voicevox-nemo.sh') }}

      - name: Generate VOICEVOX Nemo reactions
        if: steps.voice-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash scripts/generate-voicevox-nemo.sh

      - name: Build licensed multi-source sound pack
        run: node scripts/build-sound-pack.mjs

      - name: Report sound pack
        run: |
          node -e "const m=require('./assets/audio/manifest.json'); console.log('TENKA Sound Pack',m.version,m.counts,'total='+m.entries.length);"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
