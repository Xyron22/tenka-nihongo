name: Deploy TENKA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript and shell syntax
        run: |
          node --check app.js
          node --check data.js
          node --check content-pack-v1.js
          node --check v1-hooks.js
          node --check audio-patch.js
          node --check sound-pack-v1.js
          node --check scripts/build-sound-pack.mjs
          bash -n scripts/generate-voicevox-nemo.sh

      - name: TENKA V1 Safari and system smoke test
        run: node tests/smoke.js

      - name: Restore VOICEVOX Nemo sound cache
        id: voice-cache
        uses: actions/cache@v5
        with:
          path: assets/audio/voicevox
          key: ${{ runner.os }}-tenka-voicevox-nemo-${{ hashFiles('scripts/generate-voicevox-nemo.sh') }}

      - name: Generate VOICEVOX Nemo multi-voice reactions
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: bash scripts/generate-voicevox-nemo.sh

      - name: Build licensed multi-source sound pack
        run: node scripts/build-sound-pack.mjs

      - name: Validate sound pack variety
        run: |
          node - <<'NODE'
          const m=require('./assets/audio/manifest.json');
          const vv=m.entries.filter(e=>e.source==='voicevox');
          const required=['greeting','correct','wrong','combo','timeout','finish','perfect'];
          if(m.version!=='1.2.0') throw new Error('Wrong sound manifest version: '+m.version);
          if(vv.length<21) throw new Error('VOICEVOX multi-voice pack incomplete: '+vv.length+'/21');
          for(const event of required){
            const clips=vv.filter(e=>e.event===event);
            const voices=new Set(clips.map(e=>e.voice));
            if(clips.length<3||voices.size<3) throw new Error(event+' does not have 3 distinct VOICEVOX voices');
          }
          console.log('TENKA Sound Pack',m.version,m.counts,m.eventCounts,'total='+m.entries.length);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
