name: Deploy TENKA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate JavaScript and shell syntax
        run: |
          node --check app.js
          node --check data.js
          node --check content-pack-v1.js
          node --check v1-hooks.js
          node --check audio-patch.js
          node --check audio-guard-v1.2.1.js
          node --check sound-pack-v1.js
          node --check scripts/build-sound-pack.mjs
          node --check scripts/augment-calm-voice.mjs
          bash -n scripts/generate-voicevox-nemo.sh

      - name: TENKA V1 Safari and system smoke test
        run: node tests/smoke.js

      - name: Restore VOICEVOX Nemo sound cache
        id: voice-cache
        uses: actions/cache@v5
        with:
          path: assets/audio/voicevox
          key: ${{ runner.os }}-tenka-voicevox-nemo-${{ hashFiles('scripts/generate-voicevox-nemo.sh') }}

      - name: Generate VOICEVOX Nemo multi-voice reactions
        if: steps.voice-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: bash scripts/generate-voicevox-nemo.sh

      - name: Build licensed multi-source sound pack
        run: node scripts/build-sound-pack.mjs

      - name: Add second Sound Effect Lab voice style
        run: node scripts/augment-calm-voice.mjs

      - name: Validate sound pack variety
        run: |
          node - <<'NODE'
          const m=require('./assets/audio/manifest.json');
          if(m.version!=='1.2.0') throw new Error('Wrong sound manifest version: '+m.version);
          const voices=m.entries.filter(e=>e.role==='voice');
          const styles=new Set(voices.map(e=>e.voice).filter(Boolean));
          if(styles.size<2) throw new Error('Sound pack needs at least 2 distinct voice styles; found '+[...styles].join(', '));
          for(const event of ['correct','wrong']){
            const clips=voices.filter(e=>e.event===event);
            if(clips.length<2) throw new Error(event+' needs at least 2 voice clips; found '+clips.length);
          }
          console.log('TENKA Sound Pack',m.version,m.counts,m.eventCounts,'voiceStyles='+[...styles].join(' / '),'total='+m.entries.length);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
