name: TENKA Core 2 CI and Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: tenka-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate source syntax
        run: |
          node --check data.js
          node --check content-pack-v1.js
          node --check app-v2.js
          node --check audio-engine-v3.js
          node --check sound-pack-v3.js
          node --check audio-settings-v3.js
          node --check tests/data-v2.js
          node --check tests/system-v2.js
          node --check tests/audio-v3.js
          node --check scripts/build-sound-manifest-v2.mjs
          bash -n scripts/generate-voicevox-nemo.sh

      - name: Data integrity test
        run: node tests/data-v2.js

      - name: TENKA Core 2 system regression test
        run: node tests/system-v2.js

      - name: Exam Sound v3 separation test
        run: node tests/audio-v3.js

      - name: Verify clean runtime architecture
        run: |
          test ! -e sw.js
          grep -q "audio-engine-v3.js" index.html
          grep -q "app-v2.js" index.html
          grep -q "sound-pack-v3.js" index.html
          grep -q "audio-settings-v3.js" index.html
          if grep -E "audio-engine-v2\.js|sound-pack-v2\.js|audio-patch\.js|audio-guard" index.html; then
            echo "Legacy audio runtime reference found" >&2
            exit 1
          fi
          grep -q "tenka-audio-v3" index.html
          grep -q "tenka-exam-sound-clean-300" index.html

      - name: Restore generated VOICEVOX Nemo cache
        id: voice-cache
        uses: actions/cache@v5
        with:
          path: assets/audio/voicevox
          key: ${{ runner.os }}-tenka-exam-v3-voicevox-${{ hashFiles('scripts/generate-voicevox-nemo.sh') }}

      - name: Generate celebration VOICEVOX Nemo voices
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: bash scripts/generate-voicevox-nemo.sh

      - name: Build celebration voice manifest
        run: node scripts/build-sound-manifest-v2.mjs

      - name: Validate celebration voice pack
        run: |
          node - <<'NODE'
          const m=require('./assets/audio/manifest.json');
          const events=['greeting','finish','perfect'];
          if(m.version!=='3.0.0') throw new Error('Wrong sound manifest version: '+m.version);
          if(m.entries.length!==9) throw new Error('Expected exactly 9 celebration voice clips, got '+m.entries.length);
          const styles=new Set(m.entries.map(e=>e.voice));
          if(styles.size!==3) throw new Error('Expected 3 VOICEVOX voice styles, got '+[...styles].join(', '));
          for(const event of events){
            const clips=m.entries.filter(e=>e.event===event);
            if(clips.length!==3) throw new Error(event+' must have exactly 3 voices; found '+clips.length);
          }
          for(const forbidden of ['correct','wrong','combo','timeout']){
            if(m.entries.some(e=>e.event===forbidden))throw new Error(forbidden+' must be SFX-only and cannot have voice assets');
          }
          console.log('Exam Sound v3 validated:',m.entries.length,'celebration voices');
          NODE

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
